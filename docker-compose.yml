services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: app_user
      DB_PASSWORD: ${APP_USER_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # The two data jobs. Neither is started by `docker compose up`: they run and
  # exit, they are not services. They share one image and differ only in the
  # command, which is exactly how the two Container Apps jobs are configured in
  # Azure.
  #
  #   docker compose build pipeline          build the image both jobs use
  #   docker compose run --rm pipeline       the ingestion job
  #   docker compose run --rm enrich         the enrichment job
  #
  # Neither can authenticate to Azure from your laptop: a container has no
  # `az login` and no metadata service. Build here, run in Azure, and use
  # `uv run python -m src.pipeline` when you want to run something locally.
  pipeline:
    build: ./data
    image: final-project-pipeline
    profiles: [data]
    env_file: ./data/.env
    environment:
      # Reach the database by its service name on the compose network.
      BACKEND_PG_HOST: db
      BACKEND_PG_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  enrich:
    build: ./data
    image: final-project-pipeline
    profiles: [data]
    env_file: ./data/.env
    command: ["python", "-m", "src.enrich"]

volumes:
  db-data:

networks:
  default:
    name: finalproject
