services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # The data pipeline. Not started by `docker compose up`: it is a job that
  # runs and exits, not a service. Run it the way Azure will, in a container:
  #   docker compose run --rm pipeline
  pipeline:
    build: ./data
    profiles: [data]
    env_file: ./data/.env
    environment:
      # Reach the database by its service name on the compose network.
      BACKEND_PG_HOST: db
      BACKEND_PG_PORT: "5432"
      BACKEND_PG_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

networks:
  default:
    name: finalproject
