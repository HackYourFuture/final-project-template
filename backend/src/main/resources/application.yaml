spring:
  application:
    name: hyf-project-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydb}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password}
  flyway:
    placeholders:
      # The role this application logs in as, and therefore the role that is
      # granted read access to the data team's published marts in V2.
      #
      # Deliberately not ${DB_USER}, whose default names a role that does not
      # exist in a fresh test container. CURRENT_USER is the role running the
      # migration, so this works with no configuration in tests and in local
      # development, where the application and the migration are the same
      # login. Set APP_ROLE wherever they differ, so the grants land on the
      # role that actually serves requests rather than the one that happened to
      # run the migration.
      app_role: ${APP_ROLE:CURRENT_USER}

server:
  port: ${PORT:8080}

# API Docs
springdoc:
  api-docs:
    path: /api/docs/openapi.yaml
scalar:
  enabled: true
  path: /api/docs
