spring:
  application:
    name: hyf-project-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:project_db}?currentSchema=${DB_SCHEMA:public}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password}
  flyway:
    schemas: ${DB_SCHEMA:public}

server:
  port: ${PORT:8080}

# API Docs
springdoc:
  api-docs:
    path: /api/docs/openapi.yaml
scalar:
  enabled: true
  path: /api/docs
  url: ${springdoc.api-docs.path}

