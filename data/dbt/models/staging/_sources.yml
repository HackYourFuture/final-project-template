version: 2

sources:
  - name: raw
    description: Tables written by the ingestion pipeline in src/.
    schema: "{{ env_var('POSTGRES_SCHEMA_RAW', 'raw') }}"
    tables:
      - name: postings
        description: One row per posting as received from the source API.
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
