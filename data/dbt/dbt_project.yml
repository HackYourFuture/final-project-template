name: 'final_project'
version: '1.0.0'
profile: 'final_project'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

# The landing volume to read. It comes from the environment, so the same value
# drives the ingestion job and dbt and the two cannot disagree: set LANDING_PATH
# in data/.env and both your own runs and `dbt build` follow it. On the team's
# Airflow it is set for the scheduled run.
#
# Your own runs should point at your own prefix, so rebuilding a model never
# reads a half-written file somebody else is producing. See the README,
# "Developing locally".
vars:
  landing_path: "{{ env_var('LANDING_PATH', '/Volumes/CHANGE_ME/landing/prod/postings') }}"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  final_project:
    staging:
      +materialized: view
    # Views, so they cost nothing to store and you can query them while you are
    # working out why a mart looks wrong. `ephemeral` is the other common
    # choice: it pastes the SQL into whatever selects it, which is tidier in the
    # warehouse but leaves you nothing to inspect when a number is off. While
    # you are learning, being able to select from it is worth more.
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      # Optional, and off. It calls an LLM, so it needs an API key in a secret
      # scope before it can run at all, and a `dbt build` that fails for a team
      # who never asked for it would be worse than useless. Set `enabled: true`
      # and your own `secret_scope` when your team wants it. Disabled models are
      # parsed and then ignored: it costs nothing to leave this here.
      # See ../optional/README.md.
      fct_title_discipline:
        +enabled: false
        +secret_scope: CHANGE_ME
