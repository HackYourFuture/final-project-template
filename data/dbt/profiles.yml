# Every value comes from an environment variable, so this file holds no
# secrets and is safe to commit. Set them in .env (see ../.env.example).
final_project:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      schema: "{{ env_var('DBT_SCHEMA') }}"
      threads: 4
