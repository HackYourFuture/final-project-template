# Every value comes from an environment variable, so this file holds no
# secrets and is safe to commit. Set them in .env (see ../.env.example).
#
# catalog is your team's catalog: team_a, team_b or team_c. schema is the
# schema dbt builds into. Give each teammate their own schema while you are
# developing, so two people running dbt at the same time do not overwrite each
# other's models.
final_project:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      # Your team has its own Databricks identity, not a personal token. Both
      # values come from Key Vault: fp-databricks-client-id-team-<x> and
      # fp-databricks-client-secret-team-<x>.
      auth_type: oauth
      client_id: "{{ env_var('DATABRICKS_CLIENT_ID') }}"
      client_secret: "{{ env_var('DATABRICKS_CLIENT_SECRET') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG') }}"
      schema: "{{ env_var('DBT_SCHEMA') }}"
      threads: 4
