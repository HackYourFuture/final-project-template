# Local development stack.
#
# One service: a Postgres that stands in for the backend team's database. Use
# it to build and test the publish step before the real backend database
# exists, and to show the backend trainees what your mart will look like on
# their side.
#
# Your raw data does not live here. It lands as files in your team's Databricks
# volume, and dbt builds your models inside your team's catalog.
#
#   Run the ingestion from your machine:
#     uv run python -m src.pipeline
#
#   Run it the way Azure will, in the container:
#     docker compose run --rm pipeline
#
# The service is called "backend-db" rather than "postgres" on purpose: the
# Airflow stack ships its own service named postgres, and a name clash there
# sends your DAG to Airflow's metadata database instead of the backend's.
services:
  backend-db:
    image: postgres:16
    environment:
      POSTGRES_DB: backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - backendpg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    env_file: .env
    environment:
      # Reach the stand-in database by its service name on the compose network.
      BACKEND_PG_HOST: backend-db
    depends_on:
      backend-db:
        condition: service_healthy

volumes:
  backendpg:

# A fixed network name so the Airflow stack, which is a separate compose
# project, can attach to it. Without a fixed name Docker derives one from the
# folder name, which differs per checkout.
networks:
  default:
    name: finalproject
