# Local development stack: Postgres only.
#
# The pipeline and dbt run on your machine against this database, so you can
# build the whole flow before touching Azure.
#
#   docker compose up -d
#   uv run python -m src.pipeline
#   cd dbt && uv run dbt build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: finalproject
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
