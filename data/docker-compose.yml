# Local development stack.
#
# Two ways to run the pipeline, and the difference matters:
#
#   From your machine (fast to iterate, uses POSTGRES_HOST=localhost):
#     docker compose up -d postgres
#     uv run python -m src.pipeline
#     cd dbt && uv run dbt build --profiles-dir .
#
#   In the container, the way Azure will run it (uses POSTGRES_HOST=postgres):
#     docker compose run --rm pipeline
#
# Inside a container, "localhost" is the container itself, not your machine.
# That is why the pipeline service overrides POSTGRES_HOST below instead of
# taking it from .env.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: finalproject
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    env_file: .env
    environment:
      # Reach Postgres by its service name on the compose network.
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
