[project]
name = "final-project-data"
version = "0.1.0"
description = "Data pipeline for the HYF final project"
# Upper bound on purpose. uv installs the newest interpreter that satisfies
# this, and dbt-core 1.10.9 cannot run on 3.13 or later: it fails while loading
# with "UnserializableField: Field schema ... is not serializable" from
# mashumaro, which says nothing about Python versions. Without the bound, a
# fresh `uv sync` on a current machine picks 3.14 and the documented first
# `dbt build` dies before it connects to anything.
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "azure-identity>=1.19.0",
    "azure-storage-blob>=12.23.0",
]

[project.optional-dependencies]
# The sync step reads Databricks and writes the backend database.
sync = ["databricks-sql-connector>=3.4.0", "psycopg[binary]>=3.2.0"]
# Pinned exactly: dbt-databricks 1.10.11 requires dbt-core <1.10.10, so an open
# range resolves to a pair that pip and uv both reject. Bump the two together.
dbt = ["dbt-core==1.10.9", "dbt-databricks==1.10.11"]
dashboard = ["streamlit>=1.39.0", "pandas>=2.2.0", "psycopg[binary]>=3.2.0"]
# ruff lints, black formats the Python, sqlfmt formats the SQL, and ty checks
# the types. Four tools rather than argument threads about layout.
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "ty>=0.0.1a1",
    "shandy-sqlfmt>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts this folder on the import path, so tests import `src` the same way the
# container does. Without it `from src.ingest import ...` only works when you
# happen to run pytest from exactly the right directory.
pythonpath = ["."]

[tool.black]
# Matches the ruff line length below. Black owns layout, ruff owns everything
# else, and neither is allowed an opinion about the other's job.
line-length = 100

[tool.sqlfmt]
# dbt models only. The compiled output under target/ is not ours to format.
exclude = ["dbt/target/**", "dbt/dbt_packages/**"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
